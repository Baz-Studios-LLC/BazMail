[workspace]
resolver = "2"
members = ["core", "app/src-tauri"]

[workspace.package]
version = "0.1.10"
edition = "2021"

[profile.dev]
# Dependencies are rebuilt rarely and dominate cold build time; the app crate
# itself stays at opt-level 0 so incremental rebuilds remain fast.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
