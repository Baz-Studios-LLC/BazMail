# Builds BazMail for Windows and macOS.
#
# The macOS build exists here rather than on a developer machine because Tauri
# cannot cross-compile to macOS: the bundle needs Apple's own toolchain, so it
# has to run on macOS hardware. A hosted runner is the whole reason this repo
# needs CI at all.
#
# Manual run  -> attaches installers to the run as downloadable artifacts.
# Pushed tag  -> also opens a draft release with the same installers attached.

name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Needed to open the draft release on a tag build.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not cancel the other — a broken macOS
      # bundle is no reason to lose a good Windows installer.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows
            args: ""
            rust-targets: ""
          - platform: macos-latest
            label: macos
            # One universal binary rather than two downloads: it runs natively
            # on both Apple Silicon and Intel, and nobody has to know which
            # Mac they have.
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Rust dominates cold build time here — rusqlite is compiled from source.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # tauri-action runs the config's beforeBuildCommand (`npm run build`),
      # which needs the dependencies present first.
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Signing is opt-in, and it has to be opt-in *by absence*. Declaring
      # these next to the build step looks harmless but is not: a secret that
      # does not exist expands to the empty string, and an env var set to ""
      # is still present. Tauri reads APPLE_CERTIFICATE, finds it defined, and
      # tries to import an empty certificate — which fails the whole build.
      # That is not a hypothetical; it is what broke the first macOS run here.
      #
      # So the variables are exported only once a certificate is really
      # configured. Until then macOS builds unsigned, and the day the Apple
      # Developer account is approved you add the secrets and nothing in this
      # file changes.
      - name: Enable signing if certificates are configured
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "No Apple certificate configured - building unsigned."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<__CERT_EOF__"
            echo "$CERT"
            echo "__CERT_EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"

          # Notarisation only runs when all three are present; a partial set
          # would fail late, after the whole build.
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$NOTARY_APPLE_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Signing and notarisation enabled."
          else
            echo "Signing enabled; notarisation skipped (needs APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID)."
          fi

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Signs the update manifest and artifacts. This is not code signing:
          # it is the key installed copies check before accepting an update, so
          # nobody who can spoof the endpoint can hand our users a binary. The
          # build fails without it, which is the correct failure — shipping
          # unsigned updater artifacts would be worse than shipping none.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          # Empty on a manual run, which tells the action to build without
          # touching releases at all.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('BazMail {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      # Every run gets downloadable installers, tag or not. Each platform
      # matches only its own paths and ignores the rest.
      - uses: actions/upload-artifact@v4
        with:
          name: bazmail-${{ matrix.label }}
          if-no-files-found: ignore
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
