# Builds BazMail for Windows and macOS.
#
# The macOS build exists here rather than on a developer machine because Tauri
# cannot cross-compile to macOS: the bundle needs Apple's own toolchain, so it
# has to run on macOS hardware. A hosted runner is the whole reason this repo
# needs CI at all.
#
# Manual run  -> attaches installers to the run as downloadable artifacts.
# Pushed tag  -> also opens a draft release with the same installers attached.

name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Needed to open the draft release on a tag build.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not cancel the other — a broken macOS
      # bundle is no reason to lose a good Windows installer.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows
            args: ""
            rust-targets: ""
          - platform: macos-latest
            label: macos
            # One universal binary rather than two downloads: it runs natively
            # on both Apple Silicon and Intel, and nobody has to know which
            # Mac they have.
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Rust dominates cold build time here — rusqlite is compiled from source.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # tauri-action runs the config's beforeBuildCommand (`npm run build`),
      # which needs the dependencies present first.
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Signing and notarisation. Every one of these is empty until the
          # secrets exist, and Tauri simply skips signing when they are — so
          # this is wired now and starts working the day the Apple Developer
          # account is approved, with no change to this file.
          #
          # macOS: APPLE_CERTIFICATE is a base64 .p12 of the Developer ID
          # Application certificate. Notarisation needs an app-specific
          # password, never the Apple ID password itself.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # Windows: Tauri reads these for Authenticode signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          # Empty on a manual run, which tells the action to build without
          # touching releases at all.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('BazMail {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      # Every run gets downloadable installers, tag or not. Each platform
      # matches only its own paths and ignores the rest.
      - uses: actions/upload-artifact@v4
        with:
          name: bazmail-${{ matrix.label }}
          if-no-files-found: ignore
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
