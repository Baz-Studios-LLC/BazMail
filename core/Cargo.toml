[package]
name = "bazmail-core"
version.workspace = true
edition.workspace = true
description = "BazMail sync engine: canonical model, JMAP client, local store."

[lib]
name = "bazmail_core"

[dependencies]
anyhow = "1.0.104"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
futures = "0.3.34"
getrandom = "0.4.3"
keyring = "4.2.0"
mail-parser = "0.11.8"
mail-send = "0.6.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "form"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
tokio-rustls = "0.26.4"
webpki-roots = "1.0.9"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
